[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leximin"
version = "0.3.0"
description = "Claimant-centred robust leximin allocation on lossy multi-source irrigation DAGs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Adilbay Kudaybergenov"},
]
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "networkx>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
gui = ["PyQt6>=6.8", "matplotlib>=3.9", "pillow>=11.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
